<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Player signup</title>
        <link rel="stylesheet" href="signup.css">
    </head>

    <body>
        <div class="signup-container">
            <h1>Player SignUp</h1>
            <p>Welcome to <span>T.J.S</span> community!</p>
            <form>
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" placeholder="Enter your email" required>
                </div>
                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" placeholder="Enter your full name" required>
                </div>
                <div class="form-group">
                    <label for="mobile">Mobile Number</label>
                    <input type="tel" id="mobile" placeholder="Enter your mobile number">
                </div>
                <div class="form-group">
                    <label for="position">Playing Position</label>
                    <select id="position" required>
                        <option value="Goalkeeper">Goalkeeper</option>
                        <option value="Defender">Defender</option>
                        <option value="Midfielder">Midfielder</option>
                        <option value="Winger">Winger</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Create a password" required>
                </div>
                <div class="form-group">
                    <label for="picture">Upload Your Picture</label>
                    <input type="file" id="picture" accept="image/*" required>
                </div>
                <button type="submit" class="signup-btn">Create Account</button>
            </form>
            <p class="login-link">
                Already have an account?
                <a href="Player.html">Login</a>
            </p>
        </div>
    </body>
</html>
